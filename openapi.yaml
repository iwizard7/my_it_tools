openapi: 3.0.3
info:
  title: ESP32 IT Tools API
  version: 1.8.2
  description: Local developer tools and device diagnostics served by ESP32-C3.
servers:
  - url: http://192.168.4.1
paths:
  /api/system:
    get:
      summary: Device information
      responses:
        '200': {description: Device information}
  /api/metrics:
    get:
      summary: Live device metrics
      responses:
        '200': {description: Temperature, heap, uptime and storage metrics}
  /api/generate:
    get:
      summary: Generate random strings
      parameters:
        - {name: length, in: query, schema: {type: integer, minimum: 1, maximum: 256}}
        - {name: count, in: query, schema: {type: integer, minimum: 1, maximum: 20}}
      responses:
        '200': {description: Generated strings}
  /api/hash:
    post:
      summary: SHA-256 hash of raw text
      requestBody:
        required: true
        content: {text/plain: {schema: {type: string}}}
      responses:
        '200': {description: Hexadecimal SHA-256 digest}
  /api/net:
    get:
      summary: Network diagnostic
      parameters:
        - {name: op, in: query, required: true, schema: {type: string, enum: [dns, ping, http, tcp, dhcp, mdns]}}
        - {name: host, in: query, schema: {type: string}}
        - {name: port, in: query, schema: {type: integer}}
      responses:
        '200': {description: Diagnostic result}
  /api/wifi/scan:
    get:
      summary: Scan nearby Wi-Fi networks
      responses:
        '200': {description: Network list}
  /api/qr:
    get:
      summary: Generate QR SVG
      parameters:
        - {name: text, in: query, required: true, schema: {type: string, maxLength: 2000}}
      responses:
        '200': {description: SVG QR code, content: {image/svg+xml: {schema: {type: string}}}}
  /api/incident:
    get:
      summary: Run a DevOps incident probe
      parameters:
        - {name: host, in: query, required: true, schema: {type: string}}
        - {name: port, in: query, schema: {type: integer, default: 80}}
        - {name: path, in: query, schema: {type: string, default: /}}
      responses:
        '200': {description: Gateway, DNS, TCP and HTTP checks}
  /api/http:
    get:
      summary: HTTP request proxy for the local API console
      parameters:
        - {name: method, in: query, schema: {type: string, default: GET}}
        - {name: host, in: query, required: true, schema: {type: string}}
        - {name: port, in: query, schema: {type: integer, default: 80}}
        - {name: path, in: query, schema: {type: string, default: /}}
        - {name: body, in: query, schema: {type: string}}
      responses:
        '200': {description: HTTP response metadata and response body}
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200': {description: Prometheus text exposition format}
  /api/dns/lookup:
    get:
      summary: Resolve a DNS record through Debian Gateway
      parameters:
        - {name: name, in: query, required: true, schema: {type: string}}
        - {name: record_type, in: query, schema: {type: string, default: A}}
        - {name: resolver, in: query, schema: {type: string}}
      responses:
        '200': {description: DNS answers and TTL}
  /api/dns/reverse:
    get:
      summary: Reverse DNS lookup
      parameters:
        - {name: name, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: PTR answers}
  /api/dns/compare:
    get:
      summary: Compare public resolvers
      parameters:
        - {name: name, in: query, required: true, schema: {type: string}}
        - {name: record_type, in: query, schema: {type: string, default: A}}
      responses:
        '200': {description: Answers from Cloudflare, Google and Quad9}
  /api/dns/health:
    get:
      summary: Check common DNS health records
      parameters:
        - {name: name, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: A, AAAA, MX, NS, SPF, DMARC and CAA checks}
