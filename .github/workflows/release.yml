name: Firmware release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run
        working-directory: esp32
      - name: Package firmware
        run: tar -czf esp32-it-tools-firmware-${GITHUB_REF_NAME}.tar.gz -C esp32/.pio/build/esp32-c3-devkitm-1 firmware.bin bootloader.bin partitions.bin
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: esp32-it-tools-firmware-${{ github.ref_name }}.tar.gz
