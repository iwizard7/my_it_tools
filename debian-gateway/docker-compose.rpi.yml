services:
  gateway:
    build:
      context: .
      platform: linux/arm/v7
    image: my-it-tools/debian-gateway:rpi
    ports:
      - "8080:8080"
    environment:
      GATEWAY_DATA_DIR: /app/data
      PYTHONUNBUFFERED: "1"
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gateway-data:
